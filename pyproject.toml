[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omop-data-fitness-for-purpose"
version = "0.1.0"
description = "OMOP Data Fitness for Purpose utilities and guidance"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chorus AI" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = "."

[tool.setuptools]
packages = ["omop_fitness"]
